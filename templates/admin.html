<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System 2 - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">

    <div class="max-w-4xl mx-auto space-y-8">
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold text-cyan-400"><i class="fa-solid fa-gears mr-2"></i>System 2: BackEnd Management Portal</h1>
            <a href="/" target="_blank" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm transition">
                <i class="fa-solid fa-arrow-up-right-from-square mr-2"></i>View System 1 (Public Profile)
            </a>
        </div>

        <!-- UPDATE PROFILE (PUT) -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-4">
            <h2 class="text-xl font-semibold text-sky-400 border-b border-slate-800 pb-2">Update Profile Info (PUT Request)</h2>
            <form id="profileForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Full Name</label>
                        <input type="text" id="profName" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Title</label>
                        <input type="text" id="profTitle" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Degree</label>
                        <input type="text" id="profDegree" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Institution</label>
                        <input type="text" id="profInst" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:border-cyan-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Location</label>
                    <input type="text" id="profLoc" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:border-cyan-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">About Bio</label>
                    <textarea id="profBio" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:border-cyan-500 outline-none"></textarea>
                </div>
                <button type="button" onclick="updateProfile()" class="px-5 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-sm font-semibold transition">
                    Save Profile Changes (PUT)
                </button>
            </form>
        </div>

        <!-- SKILLS CRUD (POST / DELETE) -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-4">
            <h2 class="text-xl font-semibold text-teal-400 border-b border-slate-800 pb-2">Skills CRUD Operations</h2>
            
            <!-- ADD SKILL (POST) -->
            <div class="flex gap-3">
                <input type="text" id="newSkill" placeholder="Add new skill (e.g. Docker, React)" class="flex-1 bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:border-teal-500 outline-none">
                <select id="skillCategory" class="bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm">
                    <option value="General">General</option>
                    <option value="Security">Security</option>
                    <option value="Database">Database</option>
                    <option value="Programming">Programming</option>
                </select>
                <button onclick="addSkill()" class="px-4 py-2 bg-teal-600 hover:bg-teal-500 text-white rounded-lg text-sm font-semibold transition">
                    + Add Skill (POST)
                </button>
            </div>

            <!-- READ & DELETE SKILLS TABLE -->
            <div class="overflow-x-auto mt-4">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-950 text-slate-400 uppercase text-xs border-b border-slate-800">
                        <tr>
                            <th class="p-3">ID</th>
                            <th class="p-3">Skill Name</th>
                            <th class="p-3">Category</th>
                            <th class="p-3 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="skillsTable" class="divide-y divide-slate-800">
                        <!-- Dynamic Skills Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:5000/api';

        window.onload = () => {
            loadProfile();
            loadSkills();
        };

        function loadProfile() {
            fetch(`${API_BASE}/profile`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('profName').value = data.name || '';
                    document.getElementById('profTitle').value = data.title || '';
                    document.getElementById('profDegree').value = data.degree || '';
                    document.getElementById('profInst').value = data.institution || '';
                    document.getElementById('profLoc').value = data.location || '';
                    document.getElementById('profBio').value = data.bio || '';
                });
        }

        function updateProfile() {
            const payload = {
                name: document.getElementById('profName').value,
                title: document.getElementById('profTitle').value,
                degree: document.getElementById('profDegree').value,
                institution: document.getElementById('profInst').value,
                location: document.getElementById('profLoc').value,
                bio: document.getElementById('profBio').value
            };

            fetch(`${API_BASE}/profile`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => alert(res.message));
        }

        function loadSkills() {
            fetch(`${API_BASE}/skills`)
                .then(res => res.json())
                .then(skills => {
                    const tbody = document.getElementById('skillsTable');
                    tbody.innerHTML = '';
                    skills.forEach(skill => {
                        tbody.innerHTML += `
                            <tr>
                                <td class="p-3 font-mono text-slate-500">${skill.id}</td>
                                <td class="p-3 font-semibold text-slate-200">${skill.skill_name}</td>
                                <td class="p-3"><span class="px-2 py-1 bg-slate-800 rounded text-xs">${skill.category}</span></td>
                                <td class="p-3 text-right">
                                    <button onclick="deleteSkill(${skill.id})" class="text-rose-400 hover:text-rose-300 transition">
                                        <i class="fa-solid fa-trash"></i> Delete
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                });
        }

        function addSkill() {
            const name = document.getElementById('newSkill').value;
            const category = document.getElementById('skillCategory').value;
            if(!name) return alert('Enter skill name!');

            fetch(`${API_BASE}/skills`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ skill_name: name, category: category })
            })
            .then(res => res.json())
            .then(() => {
                document.getElementById('newSkill').value = '';
                loadSkills();
            });
        }

        function deleteSkill(id) {
            if(!confirm('Are you sure you want to delete this skill?')) return;
            fetch(`${API_BASE}/skills/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(() => loadSkills());
        }
    </script>
</body>
</html>
